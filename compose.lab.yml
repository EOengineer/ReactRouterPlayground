# Scaling lab overlay. Use via bin/lab (see docs/scaling-labs.md), which runs:
#   docker compose -f compose.yml -f compose.lab.yml ...
#
# Every knob below can be overridden from the shell, e.g.
#   RAILS_MAX_THREADS=10 DB_POOL=3 bin/lab restart

x-lab-db-url: &lab_db_url ${LAB_DATABASE_URL:-postgres://reactrouterplayground:reactrouterplayground@db:5432/reactrouterplayground_development}

services:
  db:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
    cpus: ${DB_CPUS:-2}

  api:
    # A fixed CPU budget makes "traffic doubled" actually saturate something on a laptop.
    cpus: ${API_CPUS:-2}
    ports: !override
      - "${LAB_API_PORT:-3000}:3000"
      - "9293:9293"
    environment:
      LAB_MODE: "1"
      RAILS_DEVELOPMENT_HOSTS: api
      DATABASE_URL: *lab_db_url
      PG_APPLICATION_NAME: puma
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-0}
      DB_POOL: ${DB_POOL:-}
      DB_CHECKOUT_TIMEOUT: ${DB_CHECKOUT_TIMEOUT:-5}
      PUMA_CONTROL_TOKEN: lab
      # Outside the bind mount, so a container killed mid-load doesn't leave a stale pid behind.
      PIDFILE: /tmp/server.pid
      SLOW_VENDOR_URL: http://slowvendor:8080

  sidekiq:
    cpus: ${SIDEKIQ_CPUS:-1}
    environment:
      LAB_MODE: "1"
      DATABASE_URL: *lab_db_url
      PG_APPLICATION_NAME: sidekiq
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      DB_POOL: ${SIDEKIQ_CONCURRENCY:-5}

  # Stand-in for a flaky third-party API: GET /delay/3s takes 3 seconds.
  slowvendor:
    image: mccutchen/go-httpbin:v2.15.0
    ports:
      - "8080:8080"

  # Transaction-mode connection pooler (Lab 4). Point Rails at it with
  #   LAB_DATABASE_URL=postgres://reactrouterplayground:reactrouterplayground@pgbouncer:5432/reactrouterplayground_development?prepared_statements=false&advisory_locks=false
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: db
      DB_USER: reactrouterplayground
      DB_PASSWORD: reactrouterplayground
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy

  k6:
    image: grafana/k6:1.3.0
    profiles: [loadtest]
    volumes:
      - ./loadtest:/scripts:ro
    environment:
      BASE_URL: http://api:3000
