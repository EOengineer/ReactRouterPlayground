services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reactrouterplayground
      POSTGRES_PASSWORD: reactrouterplayground
      POSTGRES_DB: reactrouterplayground_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactrouterplayground -d reactrouterplayground_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://reactrouterplayground:reactrouterplayground@db:5432/reactrouterplayground_development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/rails
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  sidekiq:
    build:
      context: ./backend
    command: ["bundle", "exec", "sidekiq"]
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://reactrouterplayground:reactrouterplayground@db:5432/reactrouterplayground_development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/rails
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  bundle_data:
  frontend_node_modules:
