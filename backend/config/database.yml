default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://reactrouterplayground:reactrouterplayground@localhost:5432/reactrouterplayground_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") {
    ENV.fetch("DATABASE_URL", "postgres://reactrouterplayground:reactrouterplayground@localhost:5432/reactrouterplayground_development")
      .sub("_development", "_test")
  } %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://reactrouterplayground:reactrouterplayground@localhost:5432/reactrouterplayground_production") %>
